<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemberitahuan Layanan</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background-color: white;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 400px;
            width: 100%;
            border-top: 5px solid #ef4444;
        }
        .icon {
            font-size: 65px;
            margin-bottom: 10px;
        }
        h2 {
            color: #1f2937;
            margin-bottom: 15px;
            font-size: 24px;
        }
        p {
            color: #4b5563;
            line-height: 1.6;
            margin-bottom: 30px;
            font-size: 15px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px 0;
            margin-bottom: 15px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            color: white;
            box-sizing: border-box;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .btn-pay { background-color: #3b82f6; }
        .btn-wa { background-color: #10b981; }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon">⚠️</div>
        <h2>Layanan Terisolir</h2>
        <p>Mohon maaf, koneksi internet Anda saat ini dihentikan sementara waktu karena adanya tagihan yang belum diselesaikan.</p>
        
        <!-- Ganti link lynk.id di bawah ini dengan link Anda -->
        <a href="https://lynk.id/username_anda" class="btn btn-pay">💳 Bayar Tagihan Sekarang</a>
        
        <!-- Ganti nomor 628... di bawah ini dengan nomor WA Admin -->
        <a href="https://wa.me/6281234567890?text=Halo%20Admin,%20saya%20ingin%20konfirmasi%20pembayaran%20internet" class="btn btn-wa">💬 Konfirmasi via WhatsApp</a>
    </div>

</body>
</html>
